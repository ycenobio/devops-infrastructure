name: DevOps Infrastructure Linting Pipeline

on: [push, pull_request]

jobs:
  validate_code:
    name: Lint & Verify Code Syntax
    runs-on: ubuntu-latest

    steps:
      - name: 1. Clone Repository Code
        uses: actions/checkout@v4

      - name: 2. Set Up Terraform Environment
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.5"

      - name: 3. Audit Terraform Formatting
        run: |
          cd pi-network
          terraform init -backend=false
          terraform validate

      - name: 4. Audit Ansible Playbook Best Practices
        uses: ansible/ansible-lint-action@v6
        with:
          path: "ansible-sysops/"
